<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vocabulario Tetris Centrado</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {
    background: #ddd;
    font-family: "Comic Neue", Arial, Helvetica, sans-serif;
    color: #000;
}


/* =====================================================
   HOJA CARTA
   ===================================================== */

.page {
    width: 8.5in;
    height: 11in;

    margin: 15px auto;
    padding: 0.20in;

    background: white;

    position: relative;
    overflow: hidden;

    page-break-after: always;
}


/* =====================================================
   ÁREA DE COLOCACIÓN
   ===================================================== */

.area {
    position: relative;
    width: 100%;
    height: 100%;
}


/* =====================================================
   TARJETAS
   ===================================================== */

.card {
    position: absolute;

    width: max-content;

    background: white;
    color: black;

    border: 1px solid #777;

    font-size: 12px;
    line-height: 1.15;

    white-space: nowrap;

    text-align: center;
    
    break-inside: avoid;
    page-break-inside: avoid;
}


/* INGLÉS */

.en {
    padding: 3px 5px;

    font-weight: bold;

    border-bottom: 1px solid #bbb;
}


/* ESPAÑOL */

.es {
    padding: 3px 5px;
}


/* =====================================================
   MEDIDOR INVISIBLE
   ===================================================== */

#medidor {
    position: absolute;

    left: -100000px;
    top: 0;

    visibility: hidden;
}


/* =====================================================
   IMPRESIÓN
   ===================================================== */

@page {
    size: Letter portrait;
    margin: 0;
}


@media print {

    body {
        background: white;
    }

    .page {
        margin: 0;

        width: 8.5in;
        height: 11in;

        page-break-after: always;
    }

}

</style>
</head>


<body>

<div id="documento"></div>

<div id="medidor"></div>


<script>

/* =====================================================
   CONFIGURACIÓN
   ===================================================== */


/*
   Espacio mínimo entre tarjetas.
*/

const GAP = 3;


/*
   Resolución horizontal.

   4 = buen equilibrio entre precisión y velocidad.
*/

const STEP = 4;

/* =====================================================
   UTILIDADES
   ===================================================== */

function escapeHTML(text = "") {

    return String(text)

        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =====================================================
   ESPAÑOL

   Cada ; genera salto de línea.
   ===================================================== */

function formatoEspanol(text = "") {

    return escapeHTML(text)
        .replace(/;\s*/g, ";<br>");
}


/* =====================================================
   HTML DE TARJETA
   ===================================================== */

function tarjetaHTML(item) {

    return `

        <div class="card">

            <div class="en">
                ${escapeHTML(item.en || "")}
            </div>

            <div class="es">
                ${formatoEspanol(item.es || "")}
            </div>

        </div>

    `;

}


/* =====================================================
   MEDIR TARJETAS

   Solo se miden UNA VEZ.
   ===================================================== */

function medir(items) {

    const medidor =
        document.getElementById("medidor");


    medidor.innerHTML =
        items
            .map(tarjetaHTML)
            .join("");


    const cards =
        [...medidor.querySelectorAll(".card")];


    const resultado =
        cards.map((card, index) => ({

            item: items[index],

            width:
                Math.ceil(card.offsetWidth),

            height:
                Math.ceil(card.offsetHeight)

        }));


    medidor.innerHTML = "";


    return resultado;
}


/* =====================================================
   CREAR ORDEN DE BÚSQUEDA

   Esta es la parte nueva.

   En vez de buscar:

       izquierda → derecha

   buscamos:

                 CENTRO
              ←         →
            ←             →
          ←                 →

   El lado inicial se elige aleatoriamente.
   ===================================================== */

function posicionesDesdeCentro(maxX) {

    const posiciones = [];


    const centro =
        Math.floor(maxX / 2);


    posiciones.push(centro);


    /*
       Elegimos aleatoriamente qué lado probar primero.
    */

    const izquierdaPrimero =
        Math.random() < 0.5;


    for (
        let distancia = 1;
        distancia <= maxX;
        distancia++
    ) {

        const izquierda =
            centro - distancia;

        const derecha =
            centro + distancia;


        if (izquierdaPrimero) {

            if (izquierda >= 0) {
                posiciones.push(izquierda);
            }

            if (derecha <= maxX) {
                posiciones.push(derecha);
            }

        }

        else {

            if (derecha <= maxX) {
                posiciones.push(derecha);
            }

            if (izquierda >= 0) {
                posiciones.push(izquierda);
            }

        }

    }


    return posiciones;
}


/* =====================================================
   MOTOR TETRIS CENTRADO
   ===================================================== */

function empacar(items, pageWidth, pageHeight) {

    const paginas = [];


    /*
       Las piezas difíciles primero.

       No importa el orden original.
    */

    items.sort((a, b) => {

        const areaA =
            a.width * a.height;

        const areaB =
            b.width * b.height;


        return areaB - areaA;

    });


    while (items.length) {


        /* =================================================
           NUEVA PÁGINA
           ================================================= */

        const columnas =
            Math.ceil(pageWidth / STEP);


        /*
           Cada posición horizontal guarda
           la altura ocupada.
        */

        const skyline =
            new Array(columnas).fill(0);


        const colocados = [];
        const pendientes = [];


        /* =================================================
           CADA TARJETA
           ================================================= */

        for (const item of items) {


            const span =
                Math.ceil(
                    (item.width + GAP) / STEP
                );


            const maxX =
                columnas - span;


            /*
               Tarjeta demasiado ancha.
            */

            if (maxX < 0) {

                pendientes.push(item);
                continue;

            }


            /*
               Generamos posiciones:

               centro
               izquierda/derecha
               más izquierda/más derecha
               ...
            */

            const posiciones =
                posicionesDesdeCentro(maxX);


            let mejorX = -1;
            let mejorY = Infinity;
            let mejorDistanciaCentro = Infinity;


            const centroPagina =
                pageWidth / 2;


            /* =================================================
               BUSCAR POSICIÓN
               ================================================= */

            for (const x of posiciones) {


                let y = 0;


                /*
                   Encontrar la parte más alta del suelo
                   debajo de la tarjeta.
                */

                for (
                    let i = x;
                    i < x + span;
                    i++
                ) {

                    if (skyline[i] > y) {

                        y = skyline[i];

                    }

                }


                /*
                   ¿Cabe verticalmente?
                */

                if (
                    y + item.height >
                    pageHeight
                ) {

                    continue;

                }


                /*
                   Centro real que tendría la tarjeta.
                */

                const centroTarjeta =
                    (x * STEP) +
                    (item.width / 2);


                const distanciaCentro =
                    Math.abs(
                        centroTarjeta -
                        centroPagina
                    );


                /*
                   PRIORIDAD:

                   1. quedar lo más arriba posible
                   2. si empata, quedar más cerca del centro
                */

                if (
                    y < mejorY ||
                    (
                        y === mejorY &&
                        distanciaCentro <
                        mejorDistanciaCentro
                    )
                ) {

                    mejorX = x;

                    mejorY = y;

                    mejorDistanciaCentro =
                        distanciaCentro;

                }


                /*
                   Si encontramos el suelo superior,
                   no necesitamos explorar toda la página.

                   Seguimos unas pocas posiciones para
                   mantener la preferencia central.
                */

                if (
                    mejorY === 0 &&
                    distanciaCentro < STEP * 2
                ) {

                    break;

                }

            }


            /* =================================================
               NO CABE
               ================================================= */

            if (mejorX === -1) {

                pendientes.push(item);

                continue;

            }


            /* =================================================
               RANDOM VERTICAL
               ================================================= */

            const realY = mejorY;


            const realX =
                mejorX * STEP;


            /* =================================================
               GUARDAR
               ================================================= */

            colocados.push({

                ...item,

                x: realX,
                y: realY

            });


            /* =================================================
               ACTUALIZAR SKYLINE
               ================================================= */

            const nuevaAltura =
                realY +
                item.height +
                GAP;


            for (
                let i = mejorX;
                i < mejorX + span;
                i++
            ) {

                skyline[i] =
                    nuevaAltura;

            }

        }


        /* =================================================
           SEGURIDAD
           ================================================= */

        if (!colocados.length) {

            const item =
                pendientes.shift();


            colocados.push({

                ...item,

                x:
                    Math.max(
                        0,
                        (pageWidth - item.width) / 2
                    ),

                y: 0

            });

        }


        paginas.push(colocados);

        items = pendientes;

    }


    return paginas;
}


/* =====================================================
   DIBUJAR
   ===================================================== */

function dibujar(paginas) {

    const documento =
        document.getElementById("documento");


    let html = "";


    for (const pagina of paginas) {


        html += `

            <section class="page">

                <div class="area">

        `;


        for (const card of pagina) {


            html += `

                <div
                    class="card"
                    style="
                        left:${card.x}px;
                        top:${card.y}px;
                    "
                >

                    <div class="en">
                        ${escapeHTML(card.item.en || "")}
                    </div>

                    <div class="es">
                        ${formatoEspanol(card.item.es || "")}
                    </div>

                </div>

            `;

        }


        html += `

                </div>

            </section>

        `;

    }


    documento.innerHTML = html;
}


/* =====================================================
   CARGAR JSON
   ===================================================== */

fetch("data/english_vocab.json")

.then(response => {

    if (!response.ok) {

        throw new Error(
            "No se pudo cargar el JSON"
        );

    }


    return response.json();

})

.then(data => {


    /* =================================================
       EXTRAER VOCABULARIO
       ================================================= */

    const vocabulario = [];


    for (const bloque of data.bloques || []) {

        for (
            const item
            of bloque.vocabulario || []
        ) {

            vocabulario.push(item);

        }

    }


    /* =================================================
       MEDIR UNA VEZ
       ================================================= */

    const medidas =
        medir(vocabulario);


    /* =================================================
       MEDIR ÁREA REAL DE CARTA
       ================================================= */

    const temp =
        document.createElement("section");


    temp.className = "page";


    temp.innerHTML =
        `<div class="area"></div>`;


    document.body.appendChild(temp);


    const area =
        temp.querySelector(".area");


    const pageWidth =
        Math.floor(area.clientWidth);


    const pageHeight =
        Math.floor(area.clientHeight);


    temp.remove();


    /* =================================================
       EMPACAR
       ================================================= */

    const paginas =
        empacar(
            medidas,
            pageWidth,
            pageHeight
        );


    /* =================================================
       MOSTRAR
       ================================================= */

    dibujar(paginas);


    console.log(
        "Palabras:",
        vocabulario.length
    );


    console.log(
        "Páginas:",
        paginas.length
    );

})

.catch(error => {

    console.error(error);


    document.getElementById(
        "documento"
    ).innerHTML =

        "<div style='padding:20px'>" +
        "Error: " +
        escapeHTML(error.message) +
        "</div>";

});

</script>

</body>
</html>
