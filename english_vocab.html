<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vocabulario Tetris</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {
    background: #ddd;
    font-family: Arial, Helvetica, sans-serif;
    color: #000;
}


/* =====================================================
   HOJA CARTA
   ===================================================== */

.page {

    width: 8.5in;
    height: 11in;

    margin: 15px auto;

    padding: 0.20in;

    background: white;

    position: relative;

    overflow: hidden;

    page-break-after: always;
}


/* =====================================================
   ÁREA INTERIOR
   ===================================================== */

.area {

    position: relative;

    width: 100%;
    height: 100%;
}


/* =====================================================
   TARJETAS
   ===================================================== */

.card {

    position: absolute;

    width: max-content;

    background: white;
    color: black;

    border: 1px solid #777;

    font-size: 10px;
    line-height: 1.1;

    white-space: nowrap;

    break-inside: avoid;
}


/* =====================================================
   INGLÉS
   ===================================================== */

.en {

    padding: 2px 4px;

    font-weight: bold;

    border-bottom: 1px solid #bbb;
}


/* =====================================================
   ESPAÑOL
   ===================================================== */

.es {

    padding: 2px 4px;
}


/* =====================================================
   ZONA TEMPORAL DE MEDICIÓN
   ===================================================== */

#medidor {

    position: absolute;

    left: -100000px;
    top: 0;

    visibility: hidden;

    width: auto;
}


/* =====================================================
   IMPRESIÓN
   ===================================================== */

@page {

    size: Letter portrait;
    margin: 0;

}


@media print {

    body {
        background: white;
    }

    .page {

        margin: 0;

        width: 8.5in;
        height: 11in;

        page-break-after: always;
    }

}

</style>
</head>


<body>

<div id="documento"></div>

<div id="medidor"></div>


<script>

/* =====================================================
   CONFIGURACIÓN
   ===================================================== */

/*
   Separación entre tarjetas.
*/

const GAP = 2;


/*
   Resolución horizontal del Tetris.

   4 significa que pensamos la página
   en columnas virtuales de 4 píxeles.

   Más pequeño = más preciso.
   Más grande = más rápido.

   4 es un buen equilibrio.
*/

const STEP = 4;


/* =====================================================
   ESCAPAR HTML
   ===================================================== */

function escapeHTML(text = "") {

    return String(text)

        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =====================================================
   ESPAÑOL

   ; = salto de línea
   ===================================================== */

function formatoEspanol(text = "") {

    return escapeHTML(text)
        .replace(/;\s*/g, ";<br>");
}


/* =====================================================
   HTML DE UNA TARJETA
   ===================================================== */

function tarjetaHTML(item) {

    return `

        <div class="card">

            <div class="en">
                ${escapeHTML(item.en || "")}
            </div>

            <div class="es">
                ${formatoEspanol(item.es || "")}
            </div>

        </div>

    `;

}


/* =====================================================
   MEDIR TODAS LAS TARJETAS

   IMPORTANTE:

   Esta es la ÚNICA vez que medimos el DOM.
   ===================================================== */

function medir(items) {

    const medidor =
        document.getElementById("medidor");


    /*
       Crear todas de una sola vez.
    */

    medidor.innerHTML =
        items
            .map(tarjetaHTML)
            .join("");


    const cards =
        [...medidor.querySelectorAll(".card")];


    const resultado =
        cards.map((card, index) => ({

            item:
                items[index],

            width:
                Math.ceil(card.offsetWidth),

            height:
                Math.ceil(card.offsetHeight)

        }));


    /*
       Ya no necesitamos las tarjetas temporales.
    */

    medidor.innerHTML = "";


    return resultado;
}


/* =====================================================
   TETRIS / SKYLINE

   Coloca cada tarjeta UNA SOLA VEZ.
   ===================================================== */

function empacar(items, pageWidth, pageHeight) {

    const paginas = [];


    /*
       Como el orden NO importa,
       primero ponemos las piezas difíciles.

       Altas primero.
       En empate, anchas primero.
    */

    items.sort((a, b) => {

        if (b.height !== a.height) {

            return b.height - a.height;

        }

        return b.width - a.width;

    });


    /*
       Mientras queden piezas.
    */

    while (items.length) {


        /* =============================================
           NUEVA PÁGINA
           ============================================= */

        const columnas =
            Math.ceil(pageWidth / STEP);


        /*
           skyline[x] = altura ocupada en esa columna.
        */

        const skyline =
            new Array(columnas).fill(0);


        const colocados = [];

        const pendientes = [];


        /* =============================================
           PROBAR CADA TARJETA
           ============================================= */

        for (const item of items) {


            /*
               Número de columnas virtuales que necesita.
            */

            const span =
                Math.ceil(
                    (item.width + GAP) / STEP
                );


            let mejorX = -1;

            let mejorY = Infinity;


            /*
               Buscar de izquierda a derecha.
            */

            for (
                let x = 0;
                x <= columnas - span;
                x++
            ) {


                /*
                   La tarjeta tiene que descansar sobre
                   el punto más alto debajo de ella.
                */

                let y = 0;


                for (
                    let i = x;
                    i < x + span;
                    i++
                ) {

                    if (skyline[i] > y) {

                        y = skyline[i];

                    }

                }


                /*
                   ¿Cabe verticalmente?
                */

                if (
                    y + item.height >
                    pageHeight
                ) {

                    continue;

                }


                /*
                   Queremos la posición MÁS ALTA.

                   Si empata:
                   la más a la izquierda.
                */

                if (
                    y < mejorY
                ) {

                    mejorY = y;
                    mejorX = x;

                }


                /*
                   No puede existir nada mejor
                   que y = 0.

                   Así que podemos parar.
                */

                if (mejorY === 0) {

                    break;

                }

            }


            /* =========================================
               NO CABE EN ESTA PÁGINA
               ========================================= */

            if (mejorX === -1) {

                pendientes.push(item);

                continue;

            }


            /* =========================================
               COLOCAR
               ========================================= */

            const realX =
                mejorX * STEP;


            const realY =
                mejorY;


            colocados.push({

                ...item,

                x: realX,

                y: realY

            });


            /* =========================================
               ACTUALIZAR SKYLINE
               ========================================= */

            const nuevaAltura =
                realY +
                item.height +
                GAP;


            for (
                let i = mejorX;
                i < mejorX + span;
                i++
            ) {

                skyline[i] =
                    nuevaAltura;

            }

        }


        /* =============================================
           SEGURIDAD

           Evitar bucle infinito si existe una tarjeta
           más grande que una página.
           ============================================= */

        if (!colocados.length) {

            const item =
                pendientes.shift();


            colocados.push({

                ...item,

                x: 0,
                y: 0

            });

        }


        paginas.push(colocados);


        items = pendientes;

    }


    return paginas;
}


/* =====================================================
   DIBUJAR PÁGINAS
   ===================================================== */

function dibujar(paginas) {

    const documento =
        document.getElementById("documento");


    let html = "";


    for (const pagina of paginas) {


        html += `
            <section class="page">
                <div class="area">
        `;


        for (const card of pagina) {


            html += `

                <div
                    class="card"
                    style="
                        left:${card.x}px;
                        top:${card.y}px;
                    "
                >

                    <div class="en">
                        ${escapeHTML(card.item.en || "")}
                    </div>

                    <div class="es">
                        ${formatoEspanol(card.item.es || "")}
                    </div>

                </div>

            `;

        }


        html += `
                </div>
            </section>
        `;

    }


    documento.innerHTML = html;
}


/* =====================================================
   CARGAR JSON
   ===================================================== */

fetch("data/english_vocab.json")

.then(response => {

    if (!response.ok) {

        throw new Error(
            "No se pudo cargar el JSON"
        );

    }

    return response.json();

})

.then(data => {


    /* =================================================
       SACAR TODAS LAS PALABRAS
       ================================================= */

    const vocabulario = [];


    for (const bloque of data.bloques || []) {

        for (
            const item
            of bloque.vocabulario || []
        ) {

            vocabulario.push(item);

        }

    }


    /* =================================================
       MEDIR UNA SOLA VEZ
       ================================================= */

    const medidas =
        medir(vocabulario);


    /* =================================================
       OBTENER TAMAÑO REAL DEL ÁREA DE UNA HOJA

       Creamos una página temporal.
       ================================================= */

    const temp =
        document.createElement("section");


    temp.className = "page";


    temp.innerHTML =
        `<div class="area"></div>`;


    document.body.appendChild(temp);


    const area =
        temp.querySelector(".area");


    const pageWidth =
        Math.floor(area.clientWidth);


    const pageHeight =
        Math.floor(area.clientHeight);


    temp.remove();


    /* =================================================
       TETRIS
       ================================================= */

    const paginas =
        empacar(
            medidas,
            pageWidth,
            pageHeight
        );


    /* =================================================
       MOSTRAR
       ================================================= */

    dibujar(paginas);


    console.log(
        "Palabras:",
        vocabulario.length
    );


    console.log(
        "Páginas:",
        paginas.length
    );

})

.catch(error => {

    console.error(error);


    document.getElementById(
        "documento"
    ).innerHTML =

        "<div style='padding:20px'>" +
        "Error: " +
        escapeHTML(error.message) +
        "</div>";

});

</script>

</body>
</html>
