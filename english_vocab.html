<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Vocabulario compacto</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {
    background: white;
    color: black;
    font-family: Arial, Helvetica, sans-serif;
}


/* =========================
   ÁREA DE TRABAJO
   ========================= */

.page {
    padding: 8mm;
}


/* =========================
   CONTENEDOR
   ========================= */

#vocabulario {
    position: relative;
    width: 100%;
}


/* =========================
   TARJETAS
   ========================= */

.card {
    position: absolute;

    display: inline-block;
    width: max-content;

    border: 1px solid #777;

    background: white;
    color: black;

    font-size: 11px;
    line-height: 1.15;

    overflow: hidden;

    break-inside: avoid;
}


/* INGLÉS */

.en {
    padding: 3px 5px;

    font-weight: bold;

    white-space: nowrap;

    border-bottom: 1px solid #bbb;
}


/* ESPAÑOL */

.es {
    padding: 3px 5px;

    white-space: nowrap;
}


/* =========================
   IMPRESIÓN
   ========================= */

@page {
    size: A4 portrait;
    margin: 7mm;
}

@media print {

    .page {
        padding: 0;
    }

    .card {
        break-inside: avoid;
        page-break-inside: avoid;
    }

}

</style>
</head>

<body>


<div class="page">
    <div id="vocabulario"></div>
</div>


<script>

/* ==========================================================
   CONFIGURACIÓN
   ========================================================== */

const GAP = 3;


/* ==========================================================
   ESCAPAR HTML
   ========================================================== */

function escapeHtml(text = "") {

    return String(text)

        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ==========================================================
   ESPAÑOL

   Cada ; produce salto de línea.
   ========================================================== */

function spanish(text = "") {

    return escapeHtml(text)
        .replace(/;\s*/g, ";<br>");
}


/* ==========================================================
   CREAR TARJETA
   ========================================================== */

function cardHTML(item, index) {

    return `
        <div class="card" id="card-${index}">

            <div class="en">
                ${escapeHtml(item.en || "")}
            </div>

            <div class="es">
                ${spanish(item.es || "")}
            </div>

        </div>
    `;
}


/* ==========================================================
   MOTOR DE COMPACTACIÓN
   ========================================================== */

function compactar() {

    const container =
        document.getElementById("vocabulario");

    let cards =
        [...container.querySelectorAll(".card")];


    if (!cards.length) {
        return;
    }


    /* ======================================================
       1. MEDIR TODAS LAS TARJETAS UNA SOLA VEZ
       ====================================================== */

    const items = cards.map(card => {

        return {

            element: card,

            width:
                Math.ceil(card.offsetWidth),

            height:
                Math.ceil(card.offsetHeight)

        };

    });


    /* ======================================================
       2. ORDENAR

       Primero colocamos las tarjetas grandes/difíciles.

       El JSON NO se modifica.
       Solo cambia la posición visual.
       ====================================================== */

    items.sort((a, b) => {

        const areaA =
            a.width * a.height;

        const areaB =
            b.width * b.height;

        return areaB - areaA;

    });


    /* ======================================================
       3. ANCHO DISPONIBLE
       ====================================================== */

    const WIDTH =
        Math.floor(container.clientWidth);


    /* ======================================================
       4. FILAS / ESTANTES

       Cada fila recuerda:

       y       = posición vertical
       height  = altura de la fila
       used    = ancho utilizado
       ====================================================== */

    const rows = [];


    /* ======================================================
       5. COLOCAR TARJETAS
       ====================================================== */

    items.forEach(item => {

        let bestRow = null;
        let bestWaste = Infinity;


        /* --------------------------------------------------
           BUSCAR LA FILA DONDE MEJOR ENCAJE
           -------------------------------------------------- */

        for (const row of rows) {

            const required =
                row.used === 0
                    ? item.width
                    : GAP + item.width;


            const remaining =
                WIDTH - row.used;


            if (required <= remaining) {

                const waste =
                    remaining - required;


                /*
                   Penalizamos también poner una tarjeta
                   demasiado alta en una fila bajita.
                */

                const heightDifference =
                    Math.abs(
                        row.height - item.height
                    );


                const score =
                    waste +
                    heightDifference * 2;


                if (score < bestWaste) {

                    bestWaste = score;
                    bestRow = row;

                }

            }

        }


        /* ==================================================
           SI NO CABE EN NINGUNA FILA
           CREAR FILA NUEVA
           ================================================== */

        if (!bestRow) {

            let y = 0;


            if (rows.length) {

                const last =
                    rows[rows.length - 1];

                y =
                    last.y +
                    last.height +
                    GAP;

            }


            bestRow = {

                y: y,

                height:
                    item.height,

                used: 0

            };


            rows.push(bestRow);

        }


        /* ==================================================
           POSICIÓN X
           ================================================== */

        let x =
            bestRow.used;


        if (x > 0) {

            x += GAP;

        }


        /* ==================================================
           COLOCAR
           ================================================== */

        item.element.style.left =
            x + "px";

        item.element.style.top =
            bestRow.y + "px";


        /* ==================================================
           ACTUALIZAR FILA
           ================================================== */

        bestRow.used =
            x + item.width;


        if (item.height > bestRow.height) {

            bestRow.height =
                item.height;

        }

    });


    /* ======================================================
       6. ALTURA FINAL
       ====================================================== */

    let bottom = 0;


    rows.forEach(row => {

        bottom =
            Math.max(
                bottom,
                row.y + row.height
            );

    });


    container.style.height =
        bottom + "px";

}


/* ==========================================================
   CARGAR JSON
   ========================================================== */

fetch("data/english_vocab.json")

.then(response => {

    if (!response.ok) {

        throw new Error(
            "No se pudo cargar english_vocab.json"
        );

    }

    return response.json();

})

.then(data => {

    const vocab = [];


    /* ======================================================
       EXTRAER TODOS LOS PARES
       ====================================================== */

    data.bloques.forEach(bloque => {

        bloque.vocabulario.forEach(item => {

            vocab.push(item);

        });

    });


    /* ======================================================
       CREAR TARJETAS
       ====================================================== */

    const container =
        document.getElementById("vocabulario");


    container.innerHTML =
        vocab
            .map(cardHTML)
            .join("");


    /* ======================================================
       ESPERAR AL NAVEGADOR
       ====================================================== */

    requestAnimationFrame(() => {

        compactar();

    });

})

.catch(error => {

    console.error(error);

    document.getElementById(
        "vocabulario"
    ).innerHTML =

        "<p>Error cargando el JSON: " +
        escapeHtml(error.message) +
        "</p>";

});


/* ==========================================================
   RECALCULAR AL CAMBIAR TAMAÑO
   ========================================================== */

let resizeTimer;


window.addEventListener(
    "resize",
    () => {

        clearTimeout(resizeTimer);

        resizeTimer =
            setTimeout(
                compactar,
                150
            );

    }
);

</script>

</body>
</html>
