<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vocabulario Inglés - Español</title>

<style>

/* =========================================================
   GENERAL
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {
    background: #ddd;
    color: #000;
    font-family: Arial, Helvetica, sans-serif;
}


/* =========================================================
   HOJA TAMAÑO CARTA

   Carta = 8.5 × 11 pulgadas
   ========================================================= */

.page {

    width: 8.5in;
    height: 11in;

    margin: 15px auto;

    padding: 0.25in;

    background: white;

    overflow: hidden;

    page-break-after: always;
}


/* =========================================================
   GRID / IMÁN SIMPLE
   ========================================================= */

.grid {

    width: 100%;
    height: 100%;

    display: grid;

    /*
       Columnas pequeñas para darle libertad
       al sistema de acomodación.
    */

    grid-template-columns:
        repeat(12, 1fr);

    /*
       Dense = rellenar huecos disponibles.
    */

    grid-auto-flow: dense;

    grid-auto-rows: min-content;

    gap: 2px;

    align-content: start;
    align-items: start;
}


/* =========================================================
   TARJETA
   ========================================================= */

.card {

    background: white;
    color: black;

    border: 1px solid #888;

    font-size: 10px;
    line-height: 1.12;

    break-inside: avoid;
    page-break-inside: avoid;

    /*
       Por defecto ocupa 2 columnas.
    */

    grid-column: span 2;
}


/* =========================================================
   TAMAÑOS

   El JS asignará estas clases según longitud.
   ========================================================= */

.card.small {
    grid-column: span 2;
}

.card.medium {
    grid-column: span 3;
}

.card.large {
    grid-column: span 4;
}

.card.xlarge {
    grid-column: span 5;
}


/* =========================================================
   INGLÉS
   ========================================================= */

.en {

    padding: 2px 4px;

    font-weight: bold;

    border-bottom: 1px solid #ccc;

    overflow-wrap: break-word;
}


/* =========================================================
   ESPAÑOL
   ========================================================= */

.es {

    padding: 2px 4px;

    overflow-wrap: break-word;
}


/* =========================================================
   IMPRESIÓN
   ========================================================= */

@page {

    size: Letter portrait;
    margin: 0;

}


@media print {

    body {
        background: white;
    }

    .page {

        margin: 0;

        width: 8.5in;
        height: 11in;

        page-break-after: always;
        break-after: page;
    }

}

</style>
</head>


<body>

<div id="documento"></div>


<script>

/* =========================================================
   CONFIGURACIÓN

   Cada página recibe una cantidad aproximada de "peso".

   Si alguna página se desborda, baja PAGE_CAPACITY.
   Si queda demasiado vacía, súbelo.
   ========================================================= */

const PAGE_CAPACITY = 1200;


/* =========================================================
   ESCAPAR HTML
   ========================================================= */

function escapeHTML(text = "") {

    return String(text)

        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   ESPAÑOL

   Cada ; produce salto de línea.
   ========================================================= */

function formatoEspanol(text = "") {

    return escapeHTML(text)
        .replace(/;\s*/g, ";<br>");
}


/* =========================================================
   ANALIZAR TARJETA

   No medimos el DOM.

   Solamente analizamos el texto.
   ========================================================= */

function analizar(item) {

    const en =
        String(item.en || "").trim();

    const es =
        String(item.es || "").trim();

    const partes =
        es.split(";");


    const lineaMasLarga =
        Math.max(

            en.length,

            ...partes.map(
                x => x.trim().length
            )

        );


    const lineas =
        1 + partes.length;


    /* -----------------------------------------------------
       ANCHO
       ----------------------------------------------------- */

    let size;


    if (lineaMasLarga <= 11) {

        size = "small";

    }

    else if (lineaMasLarga <= 19) {

        size = "medium";

    }

    else if (lineaMasLarga <= 30) {

        size = "large";

    }

    else {

        size = "xlarge";

    }


    /* -----------------------------------------------------
       PESO VERTICAL APROXIMADO
       ----------------------------------------------------- */

    const peso =

        18 +

        (lineas * 10) +

        Math.ceil(
            lineaMasLarga / 18
        ) * 5;


    return {

        item,
        size,
        peso,
        lineaMasLarga,
        lineas

    };

}


/* =========================================================
   CREAR TARJETA
   ========================================================= */

function crearCard(obj) {

    return `

        <div class="card ${obj.size}">

            <div class="en">
                ${escapeHTML(obj.item.en)}
            </div>

            <div class="es">
                ${formatoEspanol(obj.item.es)}
            </div>

        </div>

    `;

}


/* =========================================================
   DISTRIBUIR EN PÁGINAS

   Como NO importa el orden:

   1. Grandes primero.
   2. Vamos llenando cada hoja.
   3. Las pequeñas quedan después y CSS Dense
      puede utilizarlas para rellenar huecos.
   ========================================================= */

function crearPaginas(items) {

    /* -----------------------------------------------------
       Ordenar de grandes a pequeñas
       ----------------------------------------------------- */

    items.sort((a, b) => {

        if (b.peso !== a.peso) {
            return b.peso - a.peso;
        }

        return (
            b.lineaMasLarga -
            a.lineaMasLarga
        );

    });


    const paginas = [];

    let pagina = {

        peso: 0,
        items: []

    };


    for (const item of items) {


        /* -------------------------------------------------
           ¿Cabe aproximadamente?
           ------------------------------------------------- */

        if (
            pagina.items.length > 0 &&
            pagina.peso + item.peso > PAGE_CAPACITY
        ) {

            paginas.push(pagina);


            pagina = {

                peso: 0,
                items: []

            };

        }


        pagina.items.push(item);

        pagina.peso += item.peso;

    }


    if (pagina.items.length) {

        paginas.push(pagina);

    }


    return paginas;

}


/* =========================================================
   CARGAR JSON
   ========================================================= */

fetch("data/english_vocab.json")

.then(response => {

    if (!response.ok) {

        throw new Error(
            "No se pudo cargar el JSON"
        );

    }

    return response.json();

})

.then(data => {

    const vocabulario = [];


    /* =====================================================
       EXTRAER TODO EL VOCABULARIO
       ===================================================== */

    for (const bloque of data.bloques || []) {

        for (
            const item
            of bloque.vocabulario || []
        ) {

            vocabulario.push(
                analizar(item)
            );

        }

    }


    /* =====================================================
       CREAR PÁGINAS
       ===================================================== */

    const paginas =
        crearPaginas(vocabulario);


    let html = "";


    for (const pagina of paginas) {

        html += `

            <section class="page">

                <div class="grid">

                    ${
                        pagina.items
                            .map(crearCard)
                            .join("")
                    }

                </div>

            </section>

        `;

    }


    document.getElementById(
        "documento"
    ).innerHTML = html;


    console.log(
        "Tarjetas:",
        vocabulario.length
    );

    console.log(
        "Páginas:",
        paginas.length
    );

})


.catch(error => {

    console.error(error);


    document.getElementById(
        "documento"
    ).innerHTML =

        "<div style='padding:20px'>" +
        "Error: " +
        escapeHTML(error.message) +
        "</div>";

});

</script>

</body>
</html>
