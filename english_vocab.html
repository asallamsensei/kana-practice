<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vocabulario Inglés - Español</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {
    background: #fff;
    color: #000;
    font-family: Arial, Helvetica, sans-serif;
}


/* =========================================
   CONTENEDOR
   ========================================= */

#vocabulario {

    display: grid;

    /*
       Cada columna ocupa lo necesario,
       pero puede crecer si hay espacio.
    */

    grid-template-columns:
        repeat(auto-fill, minmax(110px, max-content));

    /*
       "dense" intenta rellenar huecos.
    */

    grid-auto-flow: dense;

    gap: 2px;

    align-items: start;

    padding: 5px;
}


/* =========================================
   TARJETAS
   ========================================= */

.card {

    background: white;
    color: black;

    border: 1px solid #999;

    font-size: 10px;
    line-height: 1.12;

    width: max-content;
    max-width: 100%;

    break-inside: avoid;
    page-break-inside: avoid;
}


/* =========================================
   INGLÉS
   ========================================= */

.en {

    font-weight: bold;

    padding: 2px 4px;

    border-bottom: 1px solid #ccc;

    white-space: nowrap;
}


/* =========================================
   ESPAÑOL
   ========================================= */

.es {

    padding: 2px 4px;

    white-space: nowrap;
}


/* =========================================
   IMPRESIÓN
   ========================================= */

@page {
    size: A4 portrait;
    margin: 6mm;
}


@media print {

    #vocabulario {
        padding: 0;
        gap: 2px;
    }

    .card {
        break-inside: avoid;
        page-break-inside: avoid;
    }

}

</style>
</head>


<body>

<div id="vocabulario"></div>


<script>

/* =========================================
   ESCAPAR HTML
   ========================================= */

function escapeHTML(text = "") {

    return String(text)

        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================
   ESPAÑOL

   ; = salto de línea
   ========================================= */

function formatoEspanol(text = "") {

    return escapeHTML(text)
        .replace(/;\s*/g, ";<br>");
}


/* =========================================
   ESTIMAR TAMAÑO

   NO medimos el DOM.

   Solamente usamos la longitud del texto.
   ========================================= */

function peso(item) {

    const en =
        String(item.en || "");

    const partes =
        String(item.es || "")
            .split(";");


    const lineaMasLarga =
        Math.max(
            en.length,
            ...partes.map(x => x.trim().length)
        );


    const lineas =
        partes.length + 1;


    return (
        lineaMasLarga * 10 +
        lineas * 20
    );

}


/* =========================================
   CARGAR JSON
   ========================================= */

fetch("data/english_vocab.json")

.then(response => {

    if (!response.ok) {

        throw new Error(
            "No se pudo cargar el JSON"
        );

    }

    return response.json();

})

.then(data => {

    const vocabulario = [];


    /* =====================================
       SACAR TODAS LAS PALABRAS
       ===================================== */

    for (const bloque of data.bloques) {

        for (const item of bloque.vocabulario) {

            vocabulario.push(item);

        }

    }


    /* =====================================
       ORDENAR

       Las tarjetas grandes primero.

       Esto ayuda al modo "dense".
       ===================================== */

    vocabulario.sort(
        (a, b) => peso(b) - peso(a)
    );


    /* =====================================
       GENERAR TODO EL HTML DE UNA SOLA VEZ
       ===================================== */

    let html = "";


    for (const item of vocabulario) {

        html += `
            <div class="card">

                <div class="en">
                    ${escapeHTML(item.en)}
                </div>

                <div class="es">
                    ${formatoEspanol(item.es)}
                </div>

            </div>
        `;

    }


    document.getElementById(
        "vocabulario"
    ).innerHTML = html;

})


.catch(error => {

    console.error(error);

    document.getElementById(
        "vocabulario"
    ).textContent =
        "Error: " + error.message;

});

</script>

</body>
</html>
