<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090d1a">
  <title>Cuentos japoneses · Asallam Sensei</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:#090d1a; --card:rgba(19,27,52,.78); --card2:rgba(255,255,255,.075);
      --text:#f5f7ff; --muted:#aeb7d6; --line:rgba(255,255,255,.13);
      --violet:#8b5cf6; --blue:#38bdf8; --green:#22c55e; --red:#ef4444;
      --gold:#facc15; --radius:22px; --shadow:0 24px 70px rgba(0,0,0,.42);
    }
    * { box-sizing:border-box }
    html { min-height:100%; background:var(--bg) }
    body {
      min-height:100vh; margin:0; color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
      background:
        radial-gradient(900px 560px at 12% 8%,rgba(139,92,246,.28),transparent 65%),
        radial-gradient(800px 520px at 92% 12%,rgba(56,189,248,.18),transparent 64%),
        radial-gradient(720px 520px at 50% 100%,rgba(34,197,94,.13),transparent 66%),var(--bg);
      padding:28px 14px 64px;
    }
    button { font:inherit }
    .app { width:min(1180px,100%); margin:auto }
    header { text-align:center; margin-bottom:18px }
    h1 { margin:0; font-size:clamp(27px,5vw,44px); letter-spacing:-.04em }
    
    .story-strip { display:flex; gap:10px; overflow-x:auto; padding:6px 3px 14px; scrollbar-width:thin }
    .layout { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:16px; align-items:start }
    .card {
      border:1px solid var(--line); border-radius:var(--radius);
      background:linear-gradient(180deg,rgba(255,255,255,.09),var(--card));
      box-shadow:var(--shadow); backdrop-filter:blur(15px);
    }

    .main {
      padding:10px clamp(17px,3vw,30px) clamp(17px,3vw,30px);
      min-height:590px;
      display:flex;
      flex-direction:column;
    }
    
    .side { padding:17px; position:sticky; top:14px }
    .section + .section { border-top:1px solid var(--line); margin-top:15px; padding-top:15px }
    .section-title { color:var(--muted); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; margin-bottom:9px }
    .stack { display:grid; gap:8px }
    .two { grid-template-columns:1fr 1fr }
    .btn {
      appearance:none; border:1px solid var(--line); color:var(--text); background:rgba(255,255,255,.07);
      border-radius:14px; padding:11px 14px; font-weight:750; cursor:pointer;
      transition:transform .16s,filter .16s,box-shadow .16s,border-color .16s,background .16s;
    }
    .btn:hover:not(:disabled) { transform:translateY(-2px); filter:brightness(1.12) }
    .btn:active:not(:disabled) { transform:translateY(0) }
    .btn:focus-visible { outline:3px solid rgba(56,189,248,.45); outline-offset:2px }
    .btn:disabled { opacity:.48; cursor:not-allowed }
    .pill { border-radius:999px; white-space:nowrap }
    .story-btn { min-width:max-content; border-color:rgba(139,92,246,.4) }
    .story-btn.active,.mode-btn.active {
      border-color:rgba(139,92,246,.8); background:linear-gradient(135deg,rgba(139,92,246,.38),rgba(56,189,248,.23));
      box-shadow:0 0 18px rgba(139,92,246,.24),inset 0 0 14px rgba(139,92,246,.08);
    }
    .mode-btn.mix.active { border-color:rgba(34,197,94,.7); background:linear-gradient(135deg,rgba(34,197,94,.34),rgba(139,92,246,.34)); box-shadow:0 0 20px rgba(34,197,94,.18) }
    .audio-btn.active { border-color:rgba(34,197,94,.68); color:#c8ffd9; box-shadow:0 0 16px rgba(34,197,94,.18); background:rgba(34,197,94,.14) }
    .danger { border-color:rgba(239,68,68,.38); color:#fecaca }
    
    .badges { display:flex; gap:7px; flex-wrap:wrap }
    .badge { padding:6px 10px; border:1px solid var(--line); border-radius:999px; color:var(--muted); background:rgba(0,0,0,.15); font-size:12px; font-weight:850 }
    
/* Información del cuento */

.side .story-strip {
  display:grid;
  gap:8px;
  padding:0;
  overflow:visible;
}

.side .story-btn {
  width:100%;
}

.story-info {
  margin-top:10px;
}

/* Interruptor Furigana */

.toggle-row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-top:12px;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(255,255,255,.05);
  color:var(--text);
  font-size:13px;
  font-weight:750;
  cursor:pointer;
}

.toggle-row input {
  position:absolute;
  opacity:0;
  pointer-events:none;
}

.toggle-slider {
  position:relative;
  flex:0 0 auto;
  width:42px;
  height:24px;
  border-radius:999px;
  background:rgba(255,255,255,.14);
  border:1px solid var(--line);
  transition:
    background .2s,
    border-color .2s,
    box-shadow .2s;
}

.toggle-slider::after {
  content:"";
  position:absolute;
  top:3px;
  left:3px;
  width:16px;
  height:16px;
  border-radius:50%;
  background:#dbe4ff;
  transition:transform .2s;
}

.toggle-row input:checked + .toggle-slider {
  background:linear-gradient(135deg,var(--violet),var(--blue));
  border-color:rgba(139,92,246,.8);
  box-shadow:0 0 14px rgba(139,92,246,.25);
}

.toggle-row input:checked + .toggle-slider::after {
  transform:translateX(18px);
}

.toggle-row input:focus-visible + .toggle-slider {
  outline:3px solid rgba(56,189,248,.4);
  outline-offset:2px;
}

.quiz {
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  text-align:center;
  padding:8px 0 4px;
}

.quiz[hidden] {
  display:none !important;
}
    
    .question { margin:8px auto 4px; max-width:830px; font-size:clamp(31px,6.5vw,66px); font-weight:700; line-height:1.18; letter-spacing:-.025em; word-break:break-word }
    .question.es { font-size:clamp(24px,4.5vw,43px) }
    ruby rt { font-size:.42em; color:#b9c7f7; font-weight:700; letter-spacing:0 }
    .furigana-off rt { display:none }
    
    .speaker {
      width:78px; height:68px; margin:8px auto; font-size:30px; border-radius:20px;
      border-color:rgba(56,189,248,.54); background:rgba(56,189,248,.11);
      box-shadow:0 0 18px rgba(56,189,248,.22),inset 0 0 13px rgba(56,189,248,.07);
    }
    .speaker.dictation { width:112px; height:94px; font-size:43px; box-shadow:0 0 24px rgba(56,189,248,.35),0 0 55px rgba(139,92,246,.14) }
    .answers { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:11px; margin:18px auto 0; width:min(850px,100%) }
    .answer {
      min-height:100px; padding:14px 12px; display:flex; flex-direction:column; align-items:center; justify-content:center;
      border:1px solid rgba(139,92,246,.43); background:rgba(139,92,246,.1); border-radius:18px;
      color:var(--text); font-size:clamp(18px,2.2vw,25px); font-weight:750; cursor:pointer; transition:.16s;
    }

   
    .answer:hover:not(:disabled) { transform:translateY(-3px); border-color:rgba(139,92,246,.85); box-shadow:0 12px 26px rgba(0,0,0,.24),0 0 18px rgba(139,92,246,.14) }
    
    .answer.correct { border-color:#4ade80; background:rgba(34,197,94,.27); box-shadow:0 0 22px rgba(34,197,94,.3); color:#dcfce7 }
    .answer.wrong { border-color:#f87171; background:rgba(239,68,68,.24); box-shadow:0 0 16px rgba(239,68,68,.18); color:#fee2e2 }
    .answer:disabled { cursor:default }

  .activity-btn.active {
  border-color:rgba(56,189,248,.8);
  background:linear-gradient(
    135deg,
    rgba(56,189,248,.32),
    rgba(139,92,246,.28)
  );
  box-shadow:0 0 18px rgba(56,189,248,.2);
}

.match-game {
  flex:1;
  padding:18px 0 4px;
  text-align:center;
}

.match-game[hidden] {
  display:none;
}

.match-board {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
  width:min(850px,100%);
  margin:0 auto;
}

.match-card {
  min-height:105px;
  padding:14px 12px;
  border:1px solid rgba(139,92,246,.43);
  border-radius:18px;
  color:var(--text);
  background:rgba(139,92,246,.1);
  font-size:clamp(18px,2.2vw,25px);
  font-weight:750;
  cursor:pointer;
  transition:.16s;
}

.match-card:hover:not(:disabled) {
  transform:translateY(-3px);
  border-color:rgba(139,92,246,.85);
}

.match-card.selected {
  border-color:var(--blue);
  background:rgba(56,189,248,.2);
  box-shadow:0 0 18px rgba(56,189,248,.25);
}

.match-card.correct {
  border-color:#4ade80;
  background:rgba(34,197,94,.27);
  color:#dcfce7;
}

.match-card.wrong {
  border-color:#f87171;
  background:rgba(239,68,68,.24);
  color:#fee2e2;
}

.match-card:disabled {
  cursor:default;
}

@media (max-width:620px) {
  .match-board {
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .match-card {
    min-height:82px;
  }
}
    
    .feedback { min-height:61px; margin:15px 0 0; font-size:19px; font-weight:750; line-height:1.45 }
    .feedback.ok { color:#86efac }.feedback.no { color:#fca5a5 }
    .detail { display:block; color:var(--text); font-size:15px; font-weight:650; margin-top:3px }
    .actions { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-top:9px }
    .primary { border-color:transparent; background:linear-gradient(135deg,var(--violet),#6d5dfc); box-shadow:0 10px 26px rgba(139,92,246,.25) }
    .stats-card { margin-top:16px; padding:16px 18px }
    .stats-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:10px }
    .stat { text-align:center; padding:10px 5px; border:1px solid var(--line); background:rgba(0,0,0,.14); border-radius:14px }
    .stat strong { display:block; font-size:clamp(19px,3vw,27px) }
    .stat span { color:var(--muted); font-size:11px; font-weight:750; text-transform:uppercase; letter-spacing:.06em }
    
    

    .note { color:var(--muted); font-size:12px; line-height:1.45; margin-top:9px }
    .loading { opacity:.65; pointer-events:none }
    .errorbox { margin:auto; max-width:700px; border:1px solid rgba(239,68,68,.5); background:rgba(239,68,68,.12); padding:18px; border-radius:16px; line-height:1.55 }

.study-progress {
  margin-bottom: 15px;
}

.study-progress-info {
  display: flex;
  justify-content: space-between;
  margin-bottom: 7px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
}

.study-progress-track {
  height: 9px;
  overflow: hidden;
  border-radius: 999px;
  background: rgba(255,255,255,.09);
}

#studyProgressBar {
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(
    90deg,
    var(--violet),
    var(--blue),
    var(--green)
  );
  box-shadow: 0 0 14px rgba(56,189,248,.45);
  transition: width .25s ease;
}

.study-results {
  margin: auto;
  padding: 35px 10px;
  text-align: center;
}

.study-results[hidden] {
  display: none;
}

.results-icon {
  font-size: 60px;
}

.study-results h2 {
  margin: 10px 0 24px;
  font-size: clamp(28px, 5vw, 44px);
}

.results-numbers {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  width: min(600px, 100%);
  margin: 0 auto 25px;
}

.results-numbers div {
  padding: 18px 10px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: rgba(0,0,0,.16);
}

.results-numbers strong {
  display: block;
  font-size: 32px;
}

.results-numbers span {
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
}

@media (max-width: 520px) {
  .results-numbers {
    grid-template-columns: 1fr;
  }
}


    
.student-name {
  width: fit-content;
  margin: 12px auto 0;
  padding: 8px 20px;
  border: 1px solid rgba(250, 204, 21, 0.65);
  border-radius: 999px;
  color: #fff4ad;
  background: rgba(250, 204, 21, 0.10);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.04em;
  box-shadow:
    0 0 12px rgba(250, 204, 21, 0.35),
    0 0 28px rgba(250, 204, 21, 0.15),
    inset 0 0 10px rgba(250, 204, 21, 0.10);
  text-shadow:
    0 0 8px rgba(250, 204, 21, 0.65),
    0 0 16px rgba(250, 204, 21, 0.30);
}
    
    @media (max-width:900px) { .layout{grid-template-columns:1fr}.side{position:static}.main{min-height:560px} }
    @media (max-width:620px) {
      body{padding:18px 10px 44px}.answers{grid-template-columns:1fr}.answer{min-height:74px}.stats-grid{grid-template-columns:repeat(2,1fr)}.stat:last-child{grid-column:1/-1}.two{grid-template-columns:1fr}.main{min-height:0}.quiz{padding-top:24px}
    }
    @media (prefers-reduced-motion:reduce) { *{scroll-behavior:auto!important;transition:none!important} }

.inline-stats {
  width: min(760px, 100%);
  margin: 18px auto 0;
  padding-top: 16px;
  border-top: 1px solid var(--line);
}

.inline-stats .stats-grid {
  grid-template-columns: repeat(5, 1fr);
}

.inline-stats .stat {
  padding: 8px 4px;
  background: rgba(0, 0, 0, .12);
}

.inline-stats .stat strong {
  font-size: 21px;
}


@media (max-width: 620px) {
  .inline-stats .stats-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
  }

  .inline-stats .stat {
    padding: 7px 2px;
  }

  .inline-stats .stat strong {
    font-size: 17px;
  }

  .inline-stats .stat span {
    font-size: 8px;
  }

  .inline-stats .stat:last-child {
    grid-column: auto;
  }
}
  
  </style>
</head>
<body>
  <main class="app" id="app">
    <header>
      <h1>物語で日本語 ☆ Asallam Sensei</h1>
      <div id="studentName" class="student-name">☆ Estudiante ☆</div>
    </header>

    <div class="layout">
      <section class="card main" aria-live="polite">

<div class="study-progress">

  <div class="study-progress-track">
    <div id="studyProgressBar"></div>
  </div>
</div>

        <div class="quiz" id="quiz">
          
          <div class="question" id="question">読み込み中…</div>
          <button class="btn speaker" id="speaker" type="button" title="Escuchar audio" aria-label="Escuchar audio">🔊</button>
          <div class="answers" id="answers"></div>
          <div class="feedback" id="feedback"></div>

            <button class="btn primary" id="nextBtn" type="button">Siguiente →</button>

<div class="inline-stats" aria-label="Estadísticas">

      <span>Aciertos</span>
    </div>

    <div class="stat">

      <strong id="accuracyStat">0%</strong>
      <span>Precisión</span>
    </div>

    <div class="stat">
      <strong id="streakStat">0</strong>
      <span>Racha</span>
    </div>

    <div class="stat">
      <strong id="bestStat">0</strong>
      <span>Mejor racha</span>
    </div>
  </div>


</div>
          
        </div>

<div class="match-game" id="matchGame" hidden>
  <div class="match-board" id="matchBoard"></div>
  <div class="feedback" id="matchFeedback"></div>
</div>
        
<div id="studyResults" class="study-results" hidden>

  <div class="results-numbers">

  <button class="btn primary" id="newStudyBtn" type="button">
    ¡Hacer otras 100!
  </button>
</div>
        
      </section>

      <aside class="card side">

        <div class="section">
          <div class="section-title">Actividad</div>
        
          <div class="stack two" id="activityButtons">
            <button
              class="btn pill activity-btn active"
              data-activity="quiz"
              type="button">
              Quiz
            </button>
        
            <button
              class="btn pill activity-btn"
              data-activity="match"
              type="button">
              Emparejar
            </button>
          </div>
        </div>

        <div class="section">
          <div class="section-title">Cuentos</div>
      
          <nav

            aria-label="Seleccionar cuento">
          </nav>
      
          <div class="badges story-info">
            <span class="badge" id="storyBadge">Cargando…</span>
            <span class="badge" id="poolBadge">0 palabras</span>
          </div>

        <!-- Sección de modos -->
        <div class="section" id="quizOptions">
          <div class="section-title">Modo de estudio</div>
      
          <div class="stack" id="modeButtons">
            <button class="btn pill mode-btn" data-mode="jp_es">
              日本語 → Español
            </button>
      
            <button class="btn pill mode-btn" data-mode="es_jp">
              Español → 日本語
            </button>

            </button>

        <div class="section" id="quizAudio">
          <div class="section-title">Audio</div>

            <button class="btn pill audio-btn active" id="audioMp3" type="button">🎙️ MP3</button>
            <button class="btn pill audio-btn" id="audioTts" type="button">🗣️ Sintetizador</button>
          </div>
          
        </div>



        <div class="section">
          <div class="section-title">Sesión</div>
          <div class="stack">
            <button class="btn danger" id="resetBtn" type="button">Reiniciar estadísticas</button>
          </div>
          <div class="note">Atajos: A/B/C responden · Enter avanza · espacio reproduce audio.</div>
        </div>
      </aside>
    </div>

  </main>

  <script>
    "use strict";

const CLAVES_ESTUDIANTES = {
  "dogtora": "Laura",
  "profe": "Sensei",
  "paopao": "Paola",
  "perseverancia": "Eduardo",
  "gratis": "Juan",
  // Añade más así:
  // "clave": "Nombre del estudiante"
};
    
    // Añade aquí una línea por cada nuevo cuento. El resto se crea automáticamente.
    const STORY_CATALOG = [
      { id:"kin_no_ono_gin_no_ono", file:"data/cuentos/kin_no_ono_gin_no_ono.json", shortTitle:"金の斧・銀の斧" },
      { id:"kitsune_to_tsuru", file:"data/cuentos/kitsune_to_tsuru.json", shortTitle:"キツネとツル" }
    ];

    const STORAGE_KEY = "asallam_cuentos_vocab_stats_v1";
const state = {
  storyId:STORY_CATALOG[0].id,
  data:null,
  all:[],
  pool:[],

  activity:"quiz",

  mode:"mix",
  roundMode:"jp_es",
  audioMode:"mp3",
  current:null,
  choices:[],
  correctIndex:-1,
  answered:false,
  lastId:null,
  audio:null,

  stats:{
    correct:0,
    wrong:0,
    streak:0,
    best:0
  },

  study:{
    correct:0,
    wrong:0,
    target:100
  },

  match:{
    cards:[],
    first:null,
    locked:false,
    matched:0,
    rounds:0
  }
};

    const $ = id => document.getElementById(id);

function autenticarEstudiante() {
  while (true) {
    let clave = prompt("Ingresa tu clave de estudiante:");

    if (clave === null) {
      alert("Necesitas una clave para entrar.");
      continue;
    }

    clave = clave.trim().toLowerCase();

    if (CLAVES_ESTUDIANTES[clave]) {
      const nombre = CLAVES_ESTUDIANTES[clave];

      $("studentName").textContent =
        `☆ Estudiante: ${nombre} ☆`;

      sessionStorage.setItem(
        "estudiante_cuentos",
        nombre
      );

      return;
    }

    alert("Clave incorrecta");
  }
}
    
    const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
    const shuffle = list => {
      const a=[...list];
      for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
      return a;
    };
    const pick = list => list[Math.floor(Math.random()*list.length)];

    function renderFurigana(item){
      const segments=Array.isArray(item.furigana)&&item.furigana.length?item.furigana:[{text:item.japanese,reading:item.reading}];
      return segments.map(s=>s.reading
        ? `<ruby>${escapeHtml(s.text)}<rt>${escapeHtml(s.reading)}</rt></ruby>`
        : escapeHtml(s.text)).join("");
    }

function statsKey() {
  if (state.activity === "match") {
    return `${state.storyId}__match`;
  }

  return `${state.storyId}__quiz__${state.mode}`;
}
    
    function readStatsStore(){ try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{}}catch{return{}} }
    function loadStats(){
      const saved=readStatsStore()[statsKey()]||{};
      state.stats={correct:+saved.correct||0,wrong:+saved.wrong||0,streak:+saved.streak||0,best:+saved.best||0};
      paintStats();
    }
    function saveStats(){
      const store=readStatsStore(); store[statsKey()]={...state.stats};
      localStorage.setItem(STORAGE_KEY,JSON.stringify(store)); paintStats();
    }
    function paintStats(){
      const s=state.stats,total=s.correct+s.wrong,accuracy=total?Math.round(s.correct/total*100):0;
      $("correctStat").textContent=s.correct; $("wrongStat").textContent=s.wrong;
      $("accuracyStat").textContent=`${accuracy}%`; $("streakStat").textContent=s.streak; $("bestStat").textContent=s.best;
      
    }

function studyTotal() {
  return state.study.correct + state.study.wrong;
}

function progressTotal() {
  return state.activity === "match"
    ? state.match.rounds
    : studyTotal();
}
    
function updateStudyProgress() {
  const total = progressTotal();
  const percentage = Math.min(
    100,
    Math.round((total / state.study.target) * 100)
  );

  $("studyProgressBar").style.width =
    `${percentage}%`;
}

function showStudyResults() {
  const total = studyTotal();

  const accuracy = total
    ? Math.round((state.study.correct / total) * 100)
    : 0;

  $("studyCorrectResult").textContent =
    state.study.correct;

  $("studyWrongResult").textContent =
    state.study.wrong;

  $("studyAccuracyResult").textContent =
    `${accuracy}%`;

  $("quiz").hidden = true;
  $("matchGame").hidden = true;
  $("studyResults").hidden = false;
}

function startNewStudy() {
  state.study = {
    correct:0,
    wrong:0,
    target:state.activity === "match" ? 34 : 100
  };

  state.match.first = null;
  state.match.locked = false;
  state.match.matched = 0;
  state.match.rounds = 0;

  $("studyResults").hidden = true;

  updateStudyProgress();
  showCurrentActivity();
}
    
    function beep(type){
      try{
        const Ctx=window.AudioContext||window.webkitAudioContext,ctx=new Ctx();
        const tones=type==="ok"?[[660,0],[880,.1]]:[[220,0],[155,.12]];
        tones.forEach(([freq,delay])=>{
          const osc=ctx.createOscillator(),gain=ctx.createGain(),start=ctx.currentTime+delay;
          osc.type=type==="ok"?"sine":"sawtooth"; osc.frequency.value=freq;
          gain.gain.setValueAtTime(.0001,start); gain.gain.exponentialRampToValueAtTime(.14,start+.015); gain.gain.exponentialRampToValueAtTime(.0001,start+.15);
          osc.connect(gain).connect(ctx.destination); osc.start(start); osc.stop(start+.17);
        });
        setTimeout(()=>ctx.close(),500);
      }catch{}
    }

    let voices=[];
    function loadVoices(){ voices=window.speechSynthesis?speechSynthesis.getVoices():[] }
    loadVoices(); if(window.speechSynthesis) speechSynthesis.onvoiceschanged=loadVoices;
    function speak(text){
      if(!window.speechSynthesis||!text)return;
      speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text);
      u.lang="ja-JP"; u.rate=.82; u.pitch=1;
      u.voice=voices.find(v=>/^ja[-_]/i.test(v.lang))||null; speechSynthesis.speak(u);
    }
    function stopAudio(){
      try{state.audio?.pause();if(state.audio)state.audio.currentTime=0}catch{}
      try{speechSynthesis.cancel()}catch{}
    }
    function audioUrl(item){
      const base=String(state.data?.audio?.basePath||"");
      return new URL(base+encodeURIComponent(item.audio),document.baseURI).href;
    }
    function playCurrent(){
      if(!state.current)return; stopAudio();
      if(state.audioMode==="tts"){speak(state.current.japanese);return}
      const audio=new Audio(audioUrl(state.current)); state.audio=audio;
      let fellBack=false; const fallback=()=>{if(fellBack)return;fellBack=true;speak(state.current.japanese)};
      audio.addEventListener("error",fallback,{once:true});
      const p=audio.play(); if(p?.catch)p.catch(fallback);
    }

    function buildStoryButtons(){
      $("storyStrip").innerHTML=STORY_CATALOG.map(s=>
        `<button class="btn pill story-btn${s.id===state.storyId?" active":""}" data-story="${escapeHtml(s.id)}">${escapeHtml(s.shortTitle)}</button>`
      ).join("");
      document.querySelectorAll("[data-story]").forEach(b=>b.onclick=()=>loadStory(b.dataset.story));
    }

    async function loadStory(id){
      const entry=STORY_CATALOG.find(s=>s.id===id); if(!entry)return;
      stopAudio(); state.storyId=id; state.data=null; state.current=null; state.answered=false;
      $("app").classList.add("loading"); buildStoryButtons();
      $("question").textContent="読み込み中…"; $("answers").innerHTML=""; $("feedback").textContent="";
      try{
        const response=await fetch(entry.file,{cache:"no-store"});
        if(!response.ok)throw new Error(`HTTP ${response.status}`);
        const data=await response.json();
        if(!Array.isArray(data.vocabulary)||data.vocabulary.length<3)throw new Error("El JSON necesita al menos 3 palabras.");

        state.data = data;
        state.all = data.vocabulary.filter(validItem);
        
        if(state.all.length<3)throw new Error("No hay suficientes entradas válidas.");
        
        $("storyBadge").textContent =
          data.story?.title?.spanish || entry.shortTitle;
        
        document.title =
          `${data.story?.title?.spanish || entry.shortTitle} · Asallam Sensei`;
        
        updatePool();
        loadStats();
        showCurrentActivity();
      }catch(error){
        $("quiz").innerHTML=`<div class="errorbox"><strong>No pude cargar el cuento.</strong><br>${escapeHtml(error.message)}<br><br>Abre estos archivos desde un servidor web y conserva el HTML junto al JSON.</div>`;
      }finally{$("app").classList.remove("loading")}
    }
    function validItem(x){ return x&&x.id&&x.japanese&&x.spanish&&x.reading }

    function updatePool(){
      state.pool = [...state.all];
      $("poolBadge").textContent = `${state.pool.length} palabras`;
    }

    function setMode(mode){
      state.mode=mode; document.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode));
      loadStats(); nextQuestion();
    }
    function setAudioMode(mode){
      state.audioMode=mode; $("audioMp3").classList.toggle("active",mode==="mp3"); $("audioTts").classList.toggle("active",mode==="tts");
      localStorage.setItem("asallam_audio_mode",mode); playCurrent();
    }
    function chooseRoundMode(){ return state.mode==="mix"?pick(["jp_es","es_jp","dictation"]):state.mode }
    function answerText(item,mode){ return mode==="es_jp"?item.japanese:item.spanish }

function setActivity(activity) {
  if (!["quiz", "match"].includes(activity)) return;

  state.activity = activity;

  document
    .querySelectorAll("[data-activity]")
    .forEach(button => {
      button.classList.toggle(
        "active",
        button.dataset.activity === activity
      );
    });

  $("quizOptions").hidden = activity === "match";
  $("quizAudio").hidden = activity === "match";
  $("studyResults").hidden = true;

  state.study = {
    correct:0,
    wrong:0,
    target:activity === "match" ? 34 : 100
  };

  state.match = {
    cards:[],
    first:null,
    locked:false,
    matched:0,
    rounds:0
  };

  loadStats();
  updateStudyProgress();
  showCurrentActivity();
}

function showCurrentActivity() {
  const matching = state.activity === "match";

  $("quiz").hidden = matching;
  $("matchGame").hidden = !matching;

  if (matching) {
    renderMatchRound();
  } else {
    nextQuestion();
  }
}

function renderMatchRound() {
  if (state.pool.length < 3) return;

  state.match.first = null;
  state.match.locked = false;
  state.match.matched = 0;

  const words = shuffle(state.pool).slice(0, 3);

  words.forEach(item => {
    const audio = new Audio(audioUrl(item));
    audio.preload = "auto";
    audio.load();
  });
  
  state.match.cards = shuffle(
    words.flatMap((item, pair) => [
      {
        pair,
        type:"jp",
        item
      },
      {
        pair,
        type:"es",
        item
      }
    ])
  );

  $("matchBoard").innerHTML =
    state.match.cards.map((card, index) => {
      const content = card.type === "jp"
        ? renderFurigana(card.item)
        : escapeHtml(card.item.spanish);

      return `
        <button
          class="match-card"
          data-match-index="${index}"
          type="button">
          ${content}
        </button>
      `;
    }).join("");

  $("matchFeedback").textContent = "";

  $("matchBoard").classList.toggle(
    "furigana-off",
    !$("furiganaToggle").checked
  );

  document
    .querySelectorAll("[data-match-index]")
    .forEach(button => {
      button.onclick = () => {
        selectMatch(
          Number(button.dataset.matchIndex),
          button
        );
      };
    });
}

function selectMatch(index, button) {
  if (
    state.match.locked ||
    button.disabled
  ) return;

  if (
    state.match.first &&
    state.match.first.button === button
  ) return;

  const card = state.match.cards[index];
  
  /* Reproducir la palabra cuando se pulsa
     un botón japonés */
  if (card.type === "jp") {
    state.current = card.item;
    playCurrent();
  }
  
  button.classList.add("selected");

  if (!state.match.first) {
    state.match.first = {
      card,
      button
    };

    return;
  }

  const first = state.match.first;

  const correct =
    first.card.pair === card.pair &&
    first.card.type !== card.type;

  if (correct) {
    first.button.disabled = true;
    button.disabled = true;

    first.button.classList.remove("selected");
    button.classList.remove("selected");

    first.button.classList.add("correct");
    button.classList.add("correct");

    state.match.first = null;
    state.match.matched++;

    state.stats.correct++;
    state.stats.streak++;
    state.stats.best = Math.max(
      state.stats.best,
      state.stats.streak
    );

    state.study.correct++;

    saveStats();
    beep("ok");

    if (state.match.matched === 3) {
      state.match.rounds++;
      updateStudyProgress();

      setTimeout(() => {
        if (
          progressTotal() >=
          state.study.target
        ) {
          showStudyResults();
        } else {
          renderMatchRound();
        }
      }, 650);
    }

    return;
  }

  state.match.locked = true;

  first.button.classList.add("wrong");
  button.classList.add("wrong");

  state.stats.wrong++;
  state.stats.streak = 0;
  state.study.wrong++;

  saveStats();
  beep("no");

  setTimeout(() => {
    first.button.classList.remove(
      "selected",
      "wrong"
    );

    button.classList.remove(
      "selected",
      "wrong"
    );

    state.match.first = null;
    state.match.locked = false;
  }, 650);
}
    
    function nextQuestion(){
      if(!state.pool.length)return;
      stopAudio(); state.answered=false; state.roundMode=chooseRoundMode();
      const candidates=state.pool.filter(x=>x.id!==state.lastId);
      state.current=pick(candidates.length?candidates:state.pool); state.lastId=state.current.id;
      const correct=answerText(state.current,state.roundMode);
      const distractors=shuffle(state.pool).filter(x=>x.id!==state.current.id).map(x=>answerText(x,state.roundMode)).filter((x,i,a)=>x!==correct&&a.indexOf(x)===i).slice(0,2);
      if(distractors.length<2)return;
      state.choices=shuffle([correct,...distractors]); state.correctIndex=state.choices.indexOf(correct);
      renderQuestion(); renderAnswers();
      $("feedback").className="feedback"; $("feedback").textContent=""; $("nextBtn").textContent="Siguiente →";
      if(state.roundMode==="dictation")setTimeout(playCurrent,180);
    }

    function renderQuestion(){
      const q=$("question"),speaker=$("speaker"),mode=state.roundMode;
      q.className="question";
    
      if(mode==="jp_es"){
        q.innerHTML=renderFurigana(state.current);
        speaker.hidden=false;
        speaker.className="btn speaker";
      }else if(mode==="es_jp"){
        q.textContent=state.current.spanish;
        q.classList.add("es");
        speaker.hidden=true;
      }else{
        q.textContent="";
        speaker.hidden=false;
        speaker.className="btn speaker dictation";
      }
    
      q.classList.toggle(
        "furigana-off",
        !$("furiganaToggle").checked
      );
    }
    
    function renderAnswers(){
      $("answers").innerHTML=state.choices.map((text,i)=>{
        const visual=state.roundMode==="es_jp"?renderFurigana(state.pool.find(x=>x.japanese===text)||{japanese:text,reading:"",furigana:[{text}]}):escapeHtml(text);
        return `<button class="answer" data-index="${i}"><span>${visual}</span></button>`;
      }).join("");
      document.querySelectorAll(".answer").forEach(b=>b.onclick=()=>answer(+b.dataset.index));
      $("answers").classList.toggle("furigana-off",!$("furiganaToggle").checked);
    }
    function answer(index){
      if(state.answered||index<0||index>2)return;
      state.answered=true; const ok=index===state.correctIndex;
      document.querySelectorAll(".answer").forEach((b,i)=>{
        b.disabled=true; b.classList.add(i===state.correctIndex?"correct":"wrong");
      });

if(ok){
  state.stats.correct++;
  state.stats.streak++;
  state.stats.best=Math.max(
    state.stats.best,
    state.stats.streak
  );

  state.study.correct++;

  beep("ok");
}else{
  state.stats.wrong++;
  state.stats.streak=0;

  state.study.wrong++;

  beep("no");
}

updateStudyProgress();
      
      saveStats();
      const word=renderFurigana(state.current),result=ok?"¡Correcto! ✓":"Incorrecto ✕";
      $("feedback").className=`feedback ${ok?"ok":"no"}`;
      $("feedback").innerHTML =
  `${result}<span class="detail">${word} ★ ${escapeHtml(state.current.romaji || "")} ★ ${escapeHtml(state.current.spanish)}</span>`;
      $("feedback").classList.toggle("furigana-off",!$("furiganaToggle").checked);
      $("nextBtn").textContent="Siguiente →";
      
if (progressTotal() >= state.study.target) {
  $("nextBtn").textContent = "Ver resultados 🏆";
}
      
      playCurrent();
    }

function skipOrNext() {
  // Segundo clic: avanzar a la siguiente pregunta
  if (state.answered) {
    if (progressTotal() >= state.study.target) {
      showStudyResults();
    } else {
      nextQuestion();
    }

    return;
  }

  // Primer clic: revisar y mostrar la respuesta
  state.answered = true;

  // Pintar la correcta en verde y las demás en rojo
  document.querySelectorAll(".answer").forEach((boton, i) => {
    boton.disabled = true;

    boton.classList.add(
      i === state.correctIndex
        ? "correct"
        : "wrong"
    );
  });

  // Saltar cuenta como error
  state.stats.wrong++;
  state.stats.streak = 0;
  state.study.wrong++;

  saveStats();
  updateStudyProgress();
  beep("no");

  // Mostrar información de la respuesta
  const word = renderFurigana(state.current);

  $("feedback").className = "feedback no";

  $("feedback").innerHTML = `
    Saltado ✕
    <span class="detail">
      ${word} ★ ${escapeHtml(state.current.romaji || "")}
      ★ ${escapeHtml(state.current.spanish)}
    </span>
  `;

  $("feedback").classList.toggle(
    "furigana-off",
    !$("furiganaToggle").checked
  );

  // Cambiar el botón para el segundo clic
  if (progressTotal() >= state.study.target) {
    $("nextBtn").textContent = "Ver resultados 🏆";
  } else {
    $("nextBtn").textContent = "Siguiente →";
  }

  playCurrent();
}

    
function resetStats() {
  const store = readStatsStore();

  delete store[statsKey()];

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(store)
  );

  state.stats = {
    correct:0,
    wrong:0,
    streak:0,
    best:0
  };

  paintStats();

  if (state.activity === "match") {
    renderMatchRound();
  } else {
    nextQuestion();
  }
}

    document
      .querySelectorAll("[data-activity]")
      .forEach(button => {
        button.onclick = () => {
          setActivity(button.dataset.activity);
        };
      });
    
    document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
    $("speaker").onclick=playCurrent; $("nextBtn").onclick=skipOrNext;
    $("resetBtn").onclick=resetStats;
    $("newStudyBtn").onclick = startNewStudy;
    $("audioMp3").onclick=()=>setAudioMode("mp3"); $("audioTts").onclick=()=>setAudioMode("tts");

$("furiganaToggle").onchange = () => {
  const hidden =
    !$("furiganaToggle").checked;

  $("question").classList.toggle(
    "furigana-off",
    hidden
  );

  $("answers").classList.toggle(
    "furigana-off",
    hidden
  );

  $("feedback").classList.toggle(
    "furigana-off",
    hidden
  );

  $("matchBoard").classList.toggle(
    "furigana-off",
    hidden
  );
};
    
document.addEventListener(
  "keydown",
  event => {
    if (
      event.target.matches(
        "input,textarea,select"
      )
    ) {
      return;
    }

    // Los siguientes atajos pertenecen
    // únicamente al Quiz.
    if (state.activity !== "quiz") {
      return;
    }

    const key =
      event.key.toLowerCase();

    if (["a","b","c"].includes(key)) {
      event.preventDefault();

      answer(
        ["a","b","c"].indexOf(key)
      );
    }
    else if (event.key === "Enter") {
      event.preventDefault();
      skipOrNext();
    }
    else if (event.code === "Space") {
      event.preventDefault();
      playCurrent();
    }
  }
);

    state.audioMode=localStorage.getItem("asallam_audio_mode")==="tts"?"tts":"mp3";
    $("audioMp3").classList.toggle("active",state.audioMode==="mp3"); $("audioTts").classList.toggle("active",state.audioMode==="tts");

const estudianteGuardado =
  sessionStorage.getItem("estudiante_cuentos");

if (estudianteGuardado) {
  $("studentName").textContent =
    `☆ Estudiante: ${estudianteGuardado} ☆`;
} else {
  autenticarEstudiante();
}
    updateStudyProgress();
    buildStoryButtons(); loadStory(state.storyId);
  </script>
</body>
</html>
